  <!-- ==================== SKILLS ==================== -->
  <section id="skills" style="background:var(--bg2);padding-top:7rem">
    <div class="container">

      <div class="reveal">
        <div class="section-title">Skills</div>
        <div class="section-sub">// TECHNICAL EXPERTISE</div>
        <div class="section-line"></div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2.5rem"
           class="reveal" id="skills-section">
        <div>
          <div style="font-family:'Share Tech Mono',monospace;font-size:.7rem;color:var(--neon);letter-spacing:.12em;margin-bottom:1.2rem">// PROGRAMMING</div>
          <div id="prog-skills"></div>
        </div>
        <div>
          <div style="font-family:'Share Tech Mono',monospace;font-size:.7rem;color:var(--neon);letter-spacing:.12em;margin-bottom:1.2rem">// CREATIVE SKILLS</div>
          <div id="creative-skills"></div>
        </div>
      </div>

    </div>
  </section>

  <footer id="site-footer"></footer>
  <div id="chatbot-widget"></div>

  <script src="js/script.js"></script>
  <script>
    /* ── SKILLS DATA ── */
    const progSkills = [
      { name: 'HTML / CSS',   pct: 90 },
      { name: 'JavaScript',   pct: 82 },
      { name: 'PHP',          pct: 75 },
      { name: 'Java',         pct: 70 },
      { name: 'Python',       pct: 65 },
      { name: 'C / C#',       pct: 60 },
      { name: 'React',        pct: 75 },
    ];
    const creativeSkills = [
      { name: 'Video Editing',  pct: 95 },
      { name: 'Photography',    pct: 90 },
      { name: 'Photo Editing',  pct: 88 },
      { name: 'UI/UX Design',   pct: 85 },
      { name: 'Graphic Design', pct: 80 },
      { name: 'Leadership',     pct: 85 },
    ];

    function renderSkills(arr, id) {
      document.getElementById(id).innerHTML = arr.map(s => `
        <div class="skill-bar-wrap">
          <div class="skill-bar-header">
            <span class="skill-name">${s.name}</span>
            <span class="skill-pct">${s.pct}%</span>
          </div>
          <div class="skill-track">
            <div class="skill-fill" data-pct="${s.pct}"></div>
          </div>
        </div>
      `).join('');
    }

    /* Trigger bar animation when section is visible */
    let skillsAnimated = false;
    function animateSkills() {
      if (skillsAnimated) return;
      const s = document.getElementById('skills-section');
      if (s && s.getBoundingClientRect().top < window.innerHeight - 100) {
        skillsAnimated = true;
        document.querySelectorAll('.skill-fill').forEach(el => {
          el.style.width = el.dataset.pct + '%';
        });
      }
    }
    window.addEventListener('scroll', animateSkills);

    function initSkills() {
      renderSkills(progSkills, 'prog-skills');
      renderSkills(creativeSkills, 'creative-skills');
      /* Small delay so bars animate on load */
      setTimeout(animateSkills, 600);
    }

    initLoading(initSkills);
  </script>
  <script type="module">

      apiHost: 'https://flowise-ai-production-4076.up.railway.app',
